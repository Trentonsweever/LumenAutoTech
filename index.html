<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Auto Tech | Roadside Assistance</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-database.js"></script>
</head>
<body>

    <header>
        <div class="logo">LUMEN AUTO TECH</div>
        <a href="tel:YOUR_PHONE_NUMBER" class="call-btn">CALL NOW</a>
    </header>

    <main id="app-container">
        <section id="request-section">
            <h1>Need a hand?</h1>
            <p>I-30 Corridor & Little Rock Area</p>
            
            <form id="help-form">
                <input type="text" id="cust-name" placeholder="Your Name" required>
                <input type="tel" id="cust-phone" placeholder="Phone Number" required>
                
                <select id="service-type">
                    <option value="tire">Flat Tire Change</option>
                    <option value="jump">Battery Jumpstart</option>
                    <option value="fuel">Fuel Delivery</option>
                    <option value="bulb">Bulb Replacement</option>
                </select>

                <button type="button" onclick="getLocation()" class="geo-btn">📍 Pin My Location</button>
                <p id="location-status">Location not set</p>

                <div id="payment-container">
                    <p class="price-note">Dispatch Fee: $40.00 (Non-refundable once en route)</p>
                    <button type="submit" id="pay-button">Pay & Dispatch</button>
                </div>
            </form>
        </section>

        <section id="status-section" style="display:none;">
            <div class="status-card">
                <h2 id="job-status">Waiting for Tech...</h2>
                <div id="eta-box">ETA: Calculating...</div>
                <div id="map-placeholder">
                    <p>Live map will appear here once tech is en route.</p>
                </div>
                <button onclick="cancelJob()" class="cancel-btn">Cancel Request</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
