<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen COMMAND</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <header class="admin-header">
        <div class="logo">LUMEN COMMAND</div>
        <button id="duty-btn" class="off-duty" onclick="toggleDuty()">OFF DUTY</button>
    </header>

    <main id="admin-feed">
        <div id="request-list"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import firebaseConfig from './config.js';

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentStatus = "off";
        let activeJobsCount = 0;
        let lastCount = 0;
        let inactivityTimeout;

        function resetTimer() {
            clearTimeout(inactivityTimeout);
            if (currentStatus === "on" && activeJobsCount === 0) {
                inactivityTimeout = setTimeout(() => { updateDutyStatus("off"); }, 30 * 60 * 1000);
            }
        }

        window.updateDutyStatus = function(status) {
            currentStatus = status;
            const btn = document.getElementById('duty-btn');
            set(ref(db, 'system_settings/status'), status);
            btn.textContent = status.toUpperCase();
            btn.className = status === 'on' ? 'on-duty' : (status === 'break' ? 'on-break' : 'off-duty');
            resetTimer();
        };

        window.toggleDuty = function() {
            if (currentStatus === "off") updateDutyStatus("on");
            else if (currentStatus === "on") updateDutyStatus("break");
            else updateDutyStatus("off");
            if (Notification.permission !== 'granted') Notification.requestPermission();
        };

        window.updateJob = (id, status) => {
            if (status === 'declined') { if(confirm("Clear?")) remove(ref(db, 'requests/'+id)); }
            else update(ref(db, 'requests/'+id), { status: status });
        };

        onValue(ref(db, 'requests'), (snapshot) => {
            const data = snapshot.val();
            const list = document.getElementById('request-list');
            list.innerHTML = "";
            activeJobsCount = 0;

            if (!data) { list.innerHTML = "<p>No active requests.</p>"; resetTimer(); return; }
            
            const count = Object.keys(data).length;
            if (count > lastCount) {
                new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
                if (Notification.permission === 'granted') new Notification("LUMEN: New Request!");
            }
            lastCount = count;

            for (let id in data) {
                const req = data[id];
                if (!req || req.status === 'cancelled') continue;
                if (req.status === 'accepted') activeJobsCount++;

                const card = document.createElement('div');
                card.className = 'job-card';
                if (req.status === 'accepted') card.style.borderLeft = "10px solid #28a745";

                const lat = req.location?.lat || 34.7465; // Default Little Rock
                const lng = req.location?.lng || -92.2896;

                card.innerHTML = `
                    <h3>${req.name || 'User'} - ${(req.service || 'Service').toUpperCase()}</h3>
                    <p>${req.on_interstate === 'yes' ? `I-30 ${req.direction} @ MM ${req.mile_marker}` : 'LOCAL CALL'}</p>
                    <div class="admin-actions">
                        ${req.status === 'pending' ? `
                            <button onclick="updateJob('${id}', 'accepted')" class="geo-btn" style="background:green;">ACCEPT</button>
                            <button onclick="updateJob('${id}', 'declined')" class="geo-btn" style="background:red;">DECLINE</button>
                        ` : `
                            <button onclick="window.open('tel:${req.phone}')" class="geo-btn">📞 CALL</button>
                            <button onclick="window.open('https://www.google.com/maps?q=${lat},${lng}')" class="geo-btn" style="background:#007bff;">📍 NAV</button>
                            <button onclick="updateJob('${id}', 'declined')" class="geo-btn" style="background:#444;">FINISH</button>
                        `}
                    </div>
                `;
                list.prepend(card);
            }
            resetTimer();
        });
        window.addEventListener('mousemove', resetTimer);
    </script>
</body>
</html>
