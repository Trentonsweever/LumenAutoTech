<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen COMMAND</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .off-duty-active { background: #dc3545 !important; color: white; }
        .on-duty { background: #28a745 !important; color: white; }
        .on-break { background: #ffc107 !important; color: black; }
        #admin-controls button { padding: 10px 15px; margin-left: 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; background: #444; color: #ccc; }
        .job-card { background: #1e1e1e; padding: 15px; margin-bottom: 10px; border-radius: 8px; transition: 0.3s; }
    </style>
</head>
<body class="admin-body">
    <header class="admin-header" style="display: flex; justify-content: space-between; align-items: center; background: #000; padding: 10px; border-bottom: 2px solid #ffc107;">
        <div class="logo" style="color: #ffc107; font-weight: bold;">LUMEN COMMAND</div>
        <div id="admin-controls">
            <button onclick="setStatus('on')" id="btn-on">ON DUTY</button>
            <button onclick="setStatus('break')" id="btn-break">BREAK</button>
            <button onclick="setStatus('off')" id="btn-off">OFF DUTY</button>
        </div>
    </header>

    <main id="admin-feed" style="padding: 15px;">
        <div id="request-list"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import firebaseConfig from './config.js';

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentStatus = "off";
        let lastCount = 0;
        let inactivityTimeout;

        // --- STATUS & INACTIVITY ---
        window.setStatus = (s) => set(ref(db, 'system_settings/status'), s);

        onValue(ref(db, 'system_settings/status'), (snap) => {
            const s = snap.val() || 'off';
            currentStatus = s;
            document.getElementById('btn-on').className = (s === 'on' ? 'on-duty' : '');
            document.getElementById('btn-break').className = (s === 'break' ? 'on-break' : '');
            document.getElementById('btn-off').className = (s === 'off' ? 'off-duty-active' : '');
            resetTimer();
        });

        function resetTimer() {
            clearTimeout(inactivityTimeout);
            if (currentStatus === 'on') {
                inactivityTimeout = setTimeout(() => { setStatus('off'); alert('Logged off due to inactivity.'); }, 30 * 60 * 1000);
            }
        }
