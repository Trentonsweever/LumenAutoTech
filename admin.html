<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen COMMAND</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <header class="admin-header">
        <div class="logo">LUMEN COMMAND</div>
        <div id="admin-controls">
            <button onclick="setStatus('on')" id="btn-on" class="off-duty">ON DUTY</button>
            <button onclick="setStatus('break')" id="btn-break" class="off-duty">BREAK</button>
            <button onclick="setStatus('off')" id="btn-off" class="off-duty">OFF DUTY</button>
        </div>
    </header>

    <main id="admin-feed">
        <div id="request-list"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import firebaseConfig from './config.js';

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentStatus = "off";
        let activeJobsCount = 0;
        let inactivityTimeout;

        // 1. Independent Buttons Logic
        window.setStatus = function(s) {
            set(ref(db, 'system_settings/status'), s);
        };

        onValue(ref(db, 'system_settings/status'), (snap) => {
            currentStatus = snap.val() || 'off';
            document.getElementById('btn-on').className = currentStatus === 'on' ? 'on-duty' : 'off-duty';
            document.getElementById('btn-break').className = currentStatus === 'break' ? 'on-break' : 'off-duty';
            document.getElementById('btn-off').className = currentStatus === 'off' ? 'off-duty' : 'off-duty';
            resetTimer();
        });

        // 2. Inactivity Dead Man's Switch
        function resetTimer() {
            clearTimeout(inactivityTimeout);
            if (currentStatus === 'on' && activeJobsCount === 0) {
                inactivityTimeout = setTimeout(() => { setStatus('off'); alert('Logged off due to inactivity.'); }, 30 * 60 * 1000);
            }
        }

        window.updateJob = (id, status) => {
            if (status === 'declined') remove(ref(db, 'requests/'+id));
            else update(ref(db, 'requests/'+id), { status: status });
        };

        // 3. Render Jobs with Finish Logic
        onValue(ref(db, 'requests'), (snapshot) => {
            const data = snapshot.val();
            const list = document.getElementById('request-list');
            list.innerHTML = "";
            activeJobsCount = 0;

            for (let id in data) {
                const req = data[id];
                if (!req || req.status === 'cancelled' || req.status === 'completed') continue;
                if (req.status === 'accepted') activeJobsCount++;

                const card = document.createElement('div');
                card.className = 'job-card';
                if (req.status === 'accepted') card.style.borderColor = "var(--success)";

                card.innerHTML = `
                    <h3>${req.name} - ${req.service}</h3>
                    <p>${req.on_interstate === 'yes' ? `I-30 ${req.direction} @ MM ${req.mile_marker}` : 'LOCAL'}</p>
                    <div class="admin-actions">
                        ${req.status === 'pending' ? `
                            <button onclick="updateJob('${id}', 'accepted')" style="background:var(--success);">ACCEPT</button>
                            <button onclick="updateJob('${id}', 'declined')" style="background:var(--danger);">DECLINE</button>
                        ` : `
                            <button onclick="window.open('tel:${req.phone}')" style="background:#555;">CALL</button>
                            <button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${req.location.lat},${req.location.lng}')" style="background:#007bff;">NAV</button>
                            <button onclick="updateJob('${id}', 'completed')" style="background:var(--success);">FINISH</button>
                        `}
                    </div>
                `;
                list.prepend(card);
            }
            resetTimer();
        });
        window.addEventListener('mousemove', resetTimer);
    </script>
</body>
</html>
