<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen COMMAND</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <header class="admin-header">
        <div class="logo">LUMEN COMMAND</div>
        <div id="admin-controls">
            <button onclick="setStatus('on')" id="btn-on">ON DUTY</button>
            <button onclick="setStatus('break')" id="btn-break">BREAK</button>
            <button onclick="setStatus('off')" id="btn-off">OFF DUTY</button>
        </div>
    </header>

    <main id="admin-feed">
        <div id="request-list"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import firebaseConfig from './config.js';

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentStatus = "off";
        let lastCount = 0;

        window.setStatus = (s) => set(ref(db, 'system_settings/status'), s);

        onValue(ref(db, 'system_settings/status'), (snap) => {
            const s = snap.val() || 'off';
            document.getElementById('btn-on').className = s === 'on' ? 'on-duty' : 'off-duty';
            document.getElementById('btn-break').className = s === 'break' ? 'on-break' : 'off-duty';
            document.getElementById('btn-off').className = s === 'off' ? 'off-duty-active' : 'off-duty';
        });

        window.cancelJob = (id) => {
            const r = prompt("1: Capacity (No Charge)\n2: No-Show (Fee applies)\n3: Out of Zone/Safety\n4: Clear/Delete");
            if (r === "1") update(ref(db, 'requests/'+id), {status:'cancelled_tech', reason:'Job exceeds capacity'});
            else if (r === "2") update(ref(db, 'requests/'+id), {status:'cancelled_noshow', reason:'Customer No-Show'});
            else if (r === "3") update(ref(db, 'requests/'+id), {status:'cancelled_safety', reason:'Safety/Zone Issue'});
            else if (r === "4") remove(ref(db, 'requests/'+id));
        };

        window.updateJob = (id, s) => update(ref(db, 'requests/'+id), { status: s });

        onValue(ref(db, 'requests'), (snapshot) => {
            const data = snapshot.val();
            const list = document.getElementById('request-list');
            list.innerHTML = "";
            
            if (data) {
                const count = Object.keys(data).length;
                if (count > lastCount) new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
                lastCount = count;

                for (let id in data) {
                    const req = data[id];
                    if (!req || req.status === 'cancelled' || req.status.startsWith('cancelled_') || req.status === 'completed') continue;

                    const card = document.createElement('div');
                    card.className = 'job-card';
                    if (req.status === 'accepted') card.style.borderColor = "#28a745";

                    card.innerHTML = `
                        <h3>${req.name}</h3>
                        <p>${req.service.toUpperCase()} | ${req.on_interstate === 'yes' ? req.direction : 'LOCAL'}</p>
                        <div class="admin-actions">
                            ${req.status === 'pending' ? 
                                `<button onclick="updateJob('${id}', 'accepted')" style="background:#28a745;">ACCEPT</button>` : 
                                `<button onclick="window.open('tel:${req.phone}')" style="background:#444;">CALL</button>
                                 <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=${req.location?.lat},${req.location?.lng}')" style="background:#007bff;">NAV</button>
                                 <button onclick="updateJob('${id}', 'completed')" style="background:#28a745;">FINISH</button>`
                            }
                            <button onclick="cancelJob('${id}')" style="background:#dc3545;">CANCEL</button>
                        </div>
                    `;
                    list.prepend(card);
                }
            }
        });
    </script>
</body>
</html>
